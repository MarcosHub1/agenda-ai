# PostgreSQL. Versions 9.5 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/opt/homebrew/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  connect_timeout: 10
  # No Neon com PgBouncer (pooler endpoint), desabilitar prepared statements evita erros de transação
  prepared_statements: <%= ENV.fetch("DATABASE_PREPARED_STATEMENTS", "false") %>

development:
  adapter: sqlite3
  database: storage/development.sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

test:
  adapter: sqlite3
  database: storage/test.sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

# Configuração de Produção - Neon PostgreSQL & Solid Trifecta
# Permite usar um único DATABASE_URL do Neon ou URLs separadas (ex: CACHE_DATABASE_URL, QUEUE_DATABASE_URL, CABLE_DATABASE_URL)
production:
  primary: &primary_production
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
    database: <%= ENV["DATABASE_URL"].present? ? nil : "agenda_ai_production" %>
    username: <%= ENV["DATABASE_URL"].present? ? nil : "agenda_ai" %>
    password: <%= ENV["DATABASE_URL"].present? ? nil : ENV["AGENDA_AI_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    url: <%= ENV["CACHE_DATABASE_URL"] || ENV["DATABASE_URL"] %>
    database: <%= (ENV["CACHE_DATABASE_URL"] || ENV["DATABASE_URL"]).present? ? nil : "agenda_ai_production_cache" %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    url: <%= ENV["QUEUE_DATABASE_URL"] || ENV["DATABASE_URL"] %>
    database: <%= (ENV["QUEUE_DATABASE_URL"] || ENV["DATABASE_URL"]).present? ? nil : "agenda_ai_production_queue" %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    url: <%= ENV["CABLE_DATABASE_URL"] || ENV["DATABASE_URL"] %>
    database: <%= (ENV["CABLE_DATABASE_URL"] || ENV["DATABASE_URL"]).present? ? nil : "agenda_ai_production_cable" %>
    migrations_paths: db/cable_migrate
